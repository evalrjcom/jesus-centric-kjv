name: Process Jesus-Centric KJV

on:
  push:
    branches: [ main ]
    paths:
      - 'jesus_centric_kjv_processor.py'
      - 'docs/TEXT-PCE.txt'
      - 'tests/**'
      - '.github/workflows/process-kjv.yml'
  pull_request:
    paths:
      - 'jesus_centric_kjv_processor.py'
      - 'docs/TEXT-PCE.txt'
      - 'tests/**'
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests

      # Source text: Pure Cambridge Edition (bibleprotector.com), committed as docs/TEXT-PCE.txt
      - name: Run processor
        run: python3 jesus_centric_kjv_processor.py --source docs/TEXT-PCE.txt docs/jesus_centric_kjv_all66.txt

      - name: Commit processed text if changed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jesus_centric_kjv_all66.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processed Jesus-centric KJV text [skip ci]"
            # Pull any concurrent commits before pushing
            git pull --rebase origin main || true
            git push
          fi

      - name: Acknowledge issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thank you for your suggestion regarding the Jesus-centric KJV! The viewer on GitHub Pages will reflect the latest processed text after the next update to the processor or a manual workflow run.'
            })
